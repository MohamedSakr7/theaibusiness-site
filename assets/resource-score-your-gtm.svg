    <text x="35" y="422" font-size="15" fill="#aaaab2">Closing</text><rect x="200" y="410" width="300" height="7" rx="3" fill="#282830"/><rect x="200" y="410" width="150" height="7" rx="3" fill="#dfae4e"/><text x="565" y="422" font-size="14" fill="#aaaab2">3/6</text>
