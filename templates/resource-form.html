<form id="resource-signup" aria-labelledby="gate-heading">
          <div class="resource-field"><label for="signup-name">Full name <span aria-hidden="true">*</span></label><input id="signup-name" name="name" type="text" autocomplete="name" required maxlength="200"></div>
          <div class="resource-field"><label for="signup-email">Email <span aria-hidden="true">*</span></label><input id="signup-email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
          <div class="resource-field"><label for="signup-role">Role</label><input id="signup-role" name="role" type="text" autocomplete="organization-title" maxlength="200"></div>
          <div class="resource-field"><label for="signup-company">Company website</label><input id="signup-company" name="company" type="text" inputmode="url" autocomplete="url" placeholder="example.com" maxlength="200"></div>
          <div class="resource-honeypot" hidden inert aria-hidden="true"><label for="signup-website">Leave this empty</label><input id="signup-website" name="website" type="text" value="" tabindex="-1" autocomplete="off" maxlength="200"></div>
          <button class="button resource-submit" type="submit">Get free access <span aria-hidden="true">↗</span></button>
          <p class="resource-consent">By submitting, you're subscribing to <strong>The AI Business newsletter</strong>. You can unsubscribe at any time.</p>
        </form>
